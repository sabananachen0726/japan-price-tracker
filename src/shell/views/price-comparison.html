<div class="tab-pane fade" id="compare-panel" role="tabpanel">
            <div class="card p-3 mb-4">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label mb-0 fw-bold"><i class="fa-solid fa-magnifying-glass me-1"></i>搜尋方式</label>
                            <div>
                                <button type="button" id="btnSingleMode" class="btn btn-sm btn-primary">單筆快速搜尋</button>
                                <button type="button" id="btnBatchMode" class="btn btn-sm btn-outline-primary">多筆 Barcode+箱數 貼入查詢</button>
                            </div>
                        </div>

                        <div id="singleSearchBox" class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="搜尋 Barcode / Item Code / 商品名稱...">
                        </div>

                        <div id="batchSearchBox" class="d-none">
                            <textarea id="batchSearchInput" class="form-control border-primary" rows="5" placeholder="在此一次貼入多個 Barcode 與採購箱數（支援從 Excel 直接複製兩欄貼上）
例如：
4901330112813, 50
4901330119999 120
4901330122222（未填數量預設為1）"></textarea>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <small class="text-muted">自動比對貼入的條碼與需求箱數；報價為單包價。</small>
                                <div>
                                    <button id="btnOpenWorkbench" class="btn btn-sm btn-primary me-2"><i class="fa-solid fa-cart-shopping me-1"></i>開啟採購工作台</button>
                                    <button id="btnExportPurchase" class="btn btn-sm btn-success me-2"><i class="fa-solid fa-file-csv me-1"></i>匯出採購決策建議單 (CSV)</button>
                                    <button id="btnClearBatchSearch" class="btn btn-sm btn-outline-secondary">清空輸入</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold"><i class="fa-solid fa-filter me-1"></i>篩選廠商</label>
                        <select id="filterSupplier" class="form-select">
                            <option value="">全部廠商比對</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="batchSummaryContainer"></div>
            <div id="purchaseWorkbenchContainer"></div>
            <div id="compareResultsContainer"></div>
        </div>
