name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Import E2E fixes once
        if: hashFiles('source-e2e-update.zip') != ''
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('source-e2e-update.zip') as archive:
              for entry in archive.infolist():
                  entry.filename = entry.filename.replace('\\', '/')
                  target = Path(entry.filename)
                  if target.is_absolute() or '..' in target.parts or target.parts[0] in ('.git', '.github'):
                      raise ValueError('Invalid archive path')
                  archive.extract(entry)
          PY
          git rm --ignore-unmatch source-e2e-update.zip
          git add src tests .gitignore README.md THIRD_PARTY.md architecture.json build.mjs package.json package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix issues found by full E2E audit'
          git push origin HEAD:main

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:e2e
      - name: Save E2E audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-audit-report
          path: test-results/e2e-audit.*
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

