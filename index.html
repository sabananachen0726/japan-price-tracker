<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本廠商價格比對與管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .nav-pills .nav-link.active { background-color: #0d6efd; font-weight: bold; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .lowest-price { color: #198754; font-weight: bold; background-color: #e8f5e9; padding: 2px 6px; border-radius: 4px; }
        .same-price-tag { color: #0d6efd; font-weight: bold; background-color: #e7f1ff; padding: 2px 6px; border-radius: 4px; }
        .price-tag { font-size: 1.1rem; }
        .badge-alias { background-color: #e9ecef; color: #495057; border: 1px solid #ced4da; margin-right: 4px; font-weight: normal; }
        .item-code-badge { background-color: #0d6efd; color: white; font-size: 0.8rem; padding: 3px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h2><i class="fa-solid fa-scale-balanced me-2 text-primary"></i>日本廠商價格比對與管理系統</h2>
        <span class="badge bg-success" id="cloudStatus"><i class="fa-solid fa-circle-check me-1"></i>系統準備就緒</span>
    </div>

    <ul class="nav nav-pills nav-fill mb-4 card p-2 flex-row" id="mainTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="compare-tab" data-bs-toggle="tab" data-bs-target="#compare-panel" type="button"><i class="fa-solid fa-magnifying-glass me-2"></i>1. 商品價格比對</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="add-tab" data-bs-toggle="tab" data-bs-target="#add-panel" type="button"><i class="fa-solid fa-plus me-2"></i>2. 匯入/新增報價</button>
        </li>
    </ul>

    <div class="tab-content" id="mainTabsContent">

        <!-- 1. 商品價格比對 -->
        <div class="tab-pane fade show active" id="compare-panel" role="tabpanel">
            <div class="card p-3 mb-4">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-bold"><i class="fa-solid fa-magnifying-glass me-1"></i>搜尋商品</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="搜尋 Barcode / Item Code / 商品名稱...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold"><i class="fa-solid fa-filter me-1"></i>篩選廠商</label>
                        <select id="filterSupplier" class="form-select">
                            <option value="">全部廠商比對</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="compareResultsContainer"></div>
        </div>

        <!-- 2. 新增/批次匯入報價 -->
        <div class="tab-pane fade" id="add-panel" role="tabpanel">
            <div class="row g-4 mx-auto" style="max-width: 900px;">
                <div class="col-md-12">
                    <div class="card p-4 border-primary border-2">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="m-0 text-primary"><i class="fa-solid fa-file-csv me-2"></i>【快速】整批 CSV 報價單匯入</h4>
                            <button id="btnDownloadTemplate" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-download me-1"></i>下載報價單 CSV 範本</button>
                        </div>
                        <p class="text-muted small">支援金額 $0 自動判定（備註填寫「停產」、「確認中」、「缺貨」或「拿不到貨」）。若多家廠商價格相同，系統將特別註記「報價相同」。</p>
                        
                        <div class="row g-2">
                            <div class="col-md-8">
                                <input type="file" id="batchQuoteCSVFile" class="form-control" accept=".csv, .txt">
                            </div>
                            <div class="col-md-4">
                                <button id="btnImportBatchCSV" class="btn btn-primary w-100" type="button"><i class="fa-solid fa-upload me-1"></i>開始批次匯入報價</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  window.appData = {
    suppliers: ["SilkRoad", "Tencho", "TokyoDirect"],
    products: {
      "4901330112813": { itemCode: "WHH005", name: "Calbee 卡樂比 蝦條 70g" },
      "4901330119999": { itemCode: "WHH006", name: "Calbee 卡樂比 蝦條 海苔味 70g" },
      "4901330122222": { itemCode: "WHH007", name: "Calbee 卡樂比 蝦條 醬油味 70g" },
      "4901330133333": { itemCode: "WHH008", name: "Calbee 卡樂比 蝦條 辣味 70g" },
      "4901330144444": { itemCode: "WHH009", name: "Calbee 卡樂比 蝦條 明太子味 70g" }
    },
    quotes: [
      // 價格相同範例：SilkRoad 與 Tencho 皆報價 108
      { id: "q1", barcode: "4901330112813", supplier: "SilkRoad", price: 108, status: "active", container: "CTN-2024-001", note: "常態報價", date: "2026-01-01" },
      { id: "q2", barcode: "4901330112813", supplier: "Tencho", price: 108, status: "active", container: "CTN-2024-001", note: "常態報價", date: "2026-01-01" },
      { id: "q3", barcode: "4901330112813", supplier: "TokyoDirect", price: 120, status: "active", container: "CTN-2024-001", note: "一般價", date: "2026-01-01" },
      
      // $0 狀態範例
      { id: "q4", barcode: "4901330122222", supplier: "TokyoDirect", price: 0, status: "discontinued", container: "CTN-2024-001", note: "停產", date: "2026-01-01" },
      { id: "q5", barcode: "4901330133333", supplier: "SilkRoad", price: 0, status: "pending", container: "CTN-2024-001", note: "待確認中", date: "2026-01-01" },
      { id: "q6", barcode: "4901330144444", supplier: "Tencho", price: 0, status: "out_of_stock", container: "CTN-2024-001", note: "廠商拿不到貨", date: "2026-01-01" }
    ]
  };

  // 下載含 $0 狀態與同價範例的 CSV 範本
  function downloadQuoteTemplate() {
    let csv = "\uFEFF";
    csv += "Barcode/條碼(必填),ItemCode/內部料號(選填),商品名稱(選填),圖片URL(選填),廠商名稱(必填),報價金額JPY(必填),貨櫃號碼(必填),備註/狀態(選填：停產/確認中/缺貨)\n";
    csv += "4901330112813,WHH005,Calbee 蝦條 70g,,SilkRoad,108,CTN-2024-001,價格相同測試1\n";
    csv += "4901330112813,WHH005,Calbee 蝦條 70g,,Tencho,108,CTN-2024-001,價格相同測試2\n";
    csv += "4901330122222,WHH007,Calbee 蝦條 醬油味 70g,,TokyoDirect,0,CTN-2024-001,停產\n";
    csv += "4901330133333,WHH008,Calbee 蝦條 辣味 70g,,SilkRoad,0,CTN-2024-001,待確認中\n";
    csv += "4901330144444,WHH009,Calbee 蝦條 明太子味 70g,,Tencho,0,CTN-2024-001,廠商拿不到貨\n";

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `報價單匯入範本.csv`;
    link.click();
  }

  // 自動解析 $0 狀態
  function parseQuoteStatus(price, note) {
    if (!isNaN(price) && price > 0) return { status: 'active', price: price };
    
    let status = 'pending';
    note = note || '';
    if (note.includes('停產')) {
      status = 'discontinued';
    } else if (note.includes('缺貨') || note.includes('拿不到') || note.includes('無貨')) {
      status = 'out_of_stock';
    } else {
      status = 'pending';
    }
    return { status: status, price: 0 };
  }

  function renderSupplierOptions() {
    const filter = document.getElementById("filterSupplier");
    filter.innerHTML = '<option value="">全部廠商比對</option>';
    (window.appData.suppliers || []).forEach(s => {
      filter.innerHTML += `<option value="${s}">${s}</option>`;
    });
  }

  function renderCompareList() {
    const container = document.getElementById("compareResultsContainer");
    if (!container) return;
    const filterSup = document.getElementById("filterSupplier").value;
    const rawKeyword = document.getElementById("searchInput").value.trim().toLowerCase();

    let grouped = {};
    window.appData.quotes.forEach(q => {
      if (!grouped[q.barcode]) grouped[q.barcode] = [];
      grouped[q.barcode].push(q);
    });

    container.innerHTML = "";

    for (let mainB in window.appData.products) {
      const productInfo = window.appData.products[mainB];
      
      if (rawKeyword) {
        const matchName = (productInfo.name || '').toLowerCase().includes(rawKeyword);
        const matchItemCode = (productInfo.itemCode || '').toLowerCase().includes(rawKeyword);
        const matchBarcode = mainB.toLowerCase().includes(rawKeyword);
        if (!matchName && !matchBarcode && !matchItemCode) continue;
      }

      const quotes = grouped[mainB] || [];
      let latestBySupplier = {};

      window.appData.suppliers.forEach(sup => {
        const supQuotes = quotes.filter(q => q.supplier === sup).sort((a,b) => new Date(b.date) - new Date(a.date));
        if (supQuotes.length > 0) {
          latestBySupplier[sup] = supQuotes[0];
        }
      });

      // 找出有效報價中（>0 且 active）的最低價格與最低價廠商列表
      let validQuotes = Object.values(latestBySupplier).filter(q => q.price > 0 && (q.status === 'active' || !q.status));
      let minPrice = Infinity;
      let lowestSuppliers = [];

      if (validQuotes.length > 0) {
        minPrice = Math.min(...validQuotes.map(q => q.price));
        lowestSuppliers = validQuotes.filter(q => q.price === minPrice).map(q => q.supplier);
      }

      // 判斷是否有多家廠商價格相同且並列最低
      const isPriceTied = lowestSuppliers.length > 1;

      let suppliersHtml = '<div class="row g-2 mt-2">';
      window.appData.suppliers.forEach(sup => {
        if (filterSup && sup !== filterSup) return;
        const q = latestBySupplier[sup];

        if (q) {
          const qStatus = q.status || (q.price > 0 ? 'active' : 'pending');
          let isLowest = (!isPriceTied && lowestSuppliers.includes(sup));
          let isTiedLowest = (isPriceTied && lowestSuppliers.includes(sup));

          let badgeHtml = '';
          let priceDisplay = '';

          if (qStatus === 'discontinued') {
            priceDisplay = `<span class="text-muted fw-bold">¥0 (停產)</span>`;
            badgeHtml = `<span class="badge bg-secondary">停產</span>`;
          } else if (qStatus === 'out_of_stock') {
            priceDisplay = `<span class="text-danger fw-bold">¥0 (缺貨)</span>`;
            badgeHtml = `<span class="badge bg-danger">拿不到貨</span>`;
          } else if (qStatus === 'pending') {
            priceDisplay = `<span class="text-warning fw-bold">¥0 (待確認)</span>`;
            badgeHtml = `<span class="badge bg-warning text-dark">確認中</span>`;
          } else {
            priceDisplay = `¥${q.price.toLocaleString()}`;
            if (isTiedLowest) {
              badgeHtml = `<span class="badge bg-info text-dark">報價相同</span>`;
            } else if (isLowest) {
              badgeHtml = `<span class="badge bg-success">Lowest 最低價</span>`;
            }
          }

          suppliersHtml += `
            <div class="col-md-4 col-sm-6">
              <div class="p-2 border rounded ${isLowest ? 'border-success bg-light' : (isTiedLowest ? 'border-primary bg-light' : '')}">
                <div class="d-flex justify-content-between align-items-center">
                  <span class="fw-bold">${sup}</span>
                  ${badgeHtml}
                </div>
                <div class="d-flex align-items-baseline gap-2 my-1">
                  <div class="price-tag ${isLowest ? 'lowest-price d-inline-block' : (isTiedLowest ? 'same-price-tag d-inline-block' : 'fw-bold')}">
                    ${priceDisplay}
                  </div>
                </div>
                <div class="text-muted small mt-1">
                  <div><i class="fa-solid fa-box me-1"></i>${q.container || '-'}</div>
                  <div><i class="fa-regular fa-clock me-1"></i>${q.date || '-'}</div>
                  <div>備註: ${q.note || '-'}</div>
                </div>
              </div>
            </div>`;
        } else {
          suppliersHtml += `
            <div class="col-md-4 col-sm-6">
              <div class="p-2 border rounded text-muted bg-light">
                <div class="fw-bold">${sup}</div>
                <div class="small my-2">暫無報價</div>
              </div>
            </div>`;
        }
      });
      suppliersHtml += '</div>';

      container.innerHTML += `
        <div class="card mb-3 p-3">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            ${productInfo.itemCode ? `<span class="item-code-badge">${productInfo.itemCode}</span>` : ''}
            <h5 class="m-0">${productInfo.name || '未命名商品'}</h5>
            <span class="text-muted small ms-2">Barcode: ${mainB}</span>
          </div>
          ${suppliersHtml}
        </div>`;
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("btnDownloadTemplate").addEventListener("click", downloadQuoteTemplate);
    document.getElementById("searchInput").addEventListener("input", renderCompareList);
    document.getElementById("filterSupplier").addEventListener("change", renderCompareList);

    renderSupplierOptions();
    renderCompareList();
  });
</script>

</body>
</html>
